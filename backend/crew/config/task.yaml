draft_pleading:
  description: |
    Use the `rag_search_tool` and `web_search_tool` iteratively to collect all relevant jurisprudence, legal codes, and precedents 
    related to the motion type `{motion_type}` and the factual context `{facts}`. Perform multiple searches if necessary to ensure 
    comprehensive coverage, and verify that all references are real, reliable, and up-to-date.

    Then, draft a **formal legal pleading (petition)** for the motion `{motion_type}` in case `{process}`, filed at `{court}`, 
    involving the parties `{parts}`.

    The motion must be written in **authentic legal prose**, reflecting the tone and structure of real court filings (U.S. or Brazilian format).
    The text should include paragraph numbering, procedural certification, and signature formatting consistent with official court documents.

    Follow **exactly** this Markdown structure:

      # [Court Name]
      ## Case Caption
      [Full court caption as in official pleadings — court name, jurisdiction, and parties]

      ---
      **CASE NO.:** [case number]  
      **[Plaintiff Name]**,  
      Plaintiff,  

      vs.  

      **[Defendant Name]**,  
      Defendant.  
      ---

      ## TITLE  
      [MOTION TYPE IN UPPERCASE — e.g., "PLAINTIFF’S MOTION TO COMPEL DEFENDANT’S COMPLIANCE WITH RULE 1.351(E) REQUEST FOR COPIES"]

      ## I. INTRODUCTION  
      Provide a clear and formal introduction stating who files the motion, under which rule/statute, and for what purpose.  
      The tone must be professional and concise.

      ## II. FACTUAL BACKGROUND  
      Present the relevant facts in chronological order using **numbered paragraphs (1., 2., 3., etc.)**.  
      Include verified facts or those drawn from the contextual data. Avoid conjecture.

      ## III. LEGAL GROUNDS  
      - Present well-structured arguments supported by applicable laws, procedural rules, and jurisprudence.  
      - Highlight every article, rule, or precedent in **bold** (e.g., **Rule 1.351(e)**, **Art. 5, CF/88**).  
      - Ensure legal reasoning is coherent, persuasive, and supported by authentic citations.

      ## IV. RULE 1.202 CERTIFICATION  
      Insert the procedural certification in formal tone, stating efforts made to confer with opposing counsel prior to filing the motion.  
      The certification should be written as in real pleadings, such as:

      > I certify that prior to the filing of this motion, I contacted defense counsel, [Defense Counsel Name], on [Date of Contact], and left a message regarding the matter at issue.  
      > I will continue efforts to resolve this motion before a hearing, and based on our previous discussions, I expect the issue will be resolved without need for judicial intervention.

      ## V. REQUEST FOR RELIEF  
      Conclude with the formal “WHEREFORE” paragraph, clearly specifying the relief sought.  
      Then list the requested orders using bullet points `*` for each item.

      ## VI. REFERENCES  
      List all legal sources, statutes, and jurisprudence cited.  
      - Specify whether each reference came from RAG or web search.  
      - Provide full citation details.

      ## VII. SIGNATURE BLOCK  
      Include the following placeholders for completion:
      - “City, [Month DD, YYYY]”  
      - “________________________________________”  
      - “[Attorney Name] — OAB/State XXXXX”  
      - “Attorney for [Party Name]”  
      - “[Law Firm Name, Address, Phone, Email]”

  expected_output: |
    A fully formatted legal pleading in **plain Markdown**, ready for `.docx` or `.pdf` export, containing:
    - Natural legal tone modeled after authentic motions.
    - Numbered factual and argument sections.
    - A **realistic Rule 1.202 Certification** block with contextual variables.
    - All legal references properly bolded.
    - A clean structure mirroring real-world petitions, suitable for court filing.
    - No code blocks or extraneous markdown syntax.
    - Comprehensive and verifiable references.

