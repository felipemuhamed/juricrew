draft_pleading:
  description: |
    You are drafting a formal U.S legal pleading for `{motion_type}`.

    INPUTS AVAILABLE:
    - motion_type: `{motion_type}`
    - facts: `{facts}`
    - process: `{process}`
    - parts: `{parts}`
    - court: `{court}`
    - selected_authorities: `{selected_authorities}`  (SOURCE OF TRUTH for ALL legal authorities and citations)
    - firm_template: `{firm_template}`                (SOURCE OF TRUTH for formatting/templates; REQUIRED)

    ----------------------------
    FORMATTING & TEMPLATE RULES
    ----------------------------
    - Motion formatting varies by firm and practice group.
    - DO NOT enforce any single global template.
    - You MUST follow the structure, headings, ordering, and stylistic conventions provided in `firm_template`.
    - Treat `firm_template` as the controlling formatting reference for this pleading.
    - `firm_template` controls ONLY formatting/structure; it does NOT add legal authority.
    - If `firm_template` contains placeholders (e.g., [[...]]), preserve them unless the exact information is explicitly provided
      in the inputs.
    - Output MUST be plain text formatted in a markdown-like style compatible with docx generation:
      * Use "#", "##", "###" for headings
      * Use "* " for bullet points
      * Use numbered paragraphs like "1.", "2.", "3." where appropriate

    ----------------------------
    DRAFTING INSTRUCTIONS (TEMPLATE-DRIVEN + AUTHORITY-LOCKED)
    ----------------------------
    You MUST generate the pleading by following `firm_template` as the blueprint.
    However, ALL legal citations and legal authority MUST come ONLY from `selected_authorities`.

    SECTION-BY-SECTION REQUIREMENTS (MANDATORY):
    - Caption / Case Caption:
      * Follow the template caption if present; otherwise use fallback caption.
      * Do NOT invent party names, case number, or court name; use placeholders if missing.

    - Introduction / Preliminary Statement:
      * Reference the governing procedural rule ONLY if it exists in `selected_authorities.procedural_rules`.
      * Do NOT cite or mention any rule/case not present in `selected_authorities`.

    - Facts / Background:
      * Use ONLY the provided `{facts}` content.
      * Do NOT add or infer new facts.
      * Do NOT cite new cases or statutes here unless those citations are already in `selected_authorities`
        and directly support a procedural framing (still no new authorities).

    - Legal Argument / Legal Grounds:
      * Build arguments using ONLY `selected_authorities`.
      * Bold legal references like **Fed. R. Civ. P. 12(b)(6)** or **[Case Citation]**.
      * Use binding authority first (from `selected_authorities.binding_case_law`).
      * Use persuasive authority only if it exists in `selected_authorities.persuasive_case_law`.
      * NEVER add new authority. If a needed authority is missing, state the limitation explicitly.

    - Certification:
      * Include ONLY if the template includes it OR if required by a rule already listed in `selected_authorities`.
      * Use placeholders for ANY missing detail.
      * NEVER invent conferral details.

    - Request for Relief:
      * Draft requested relief consistent with motion type and facts.
      * Do NOT cite or rely on any authority not in `selected_authorities`.

    - References:
      * Include ONLY the authorities from `selected_authorities`.
      * For each authority include: citation, source_name, url.



    ----------------------------
    FINAL CONSISTENCY CHECK (MANDATORY)
    ----------------------------
    - Ensure the pleading does not cite any authority not present in `selected_authorities`.
    - Ensure no real dates, attorney names, opposing counsel names, or conferral methods appear unless explicitly provided.
      Otherwise replace them with approved placeholders.
    - Ensure the output follows the template structure from `firm_template` (no global template).
    - Ensure the References section is a strict subset of `selected_authorities` (no extras).

    ----------------------------
    OUTPUT RESTRICTION – FINAL DOCUMENT ONLY (MANDATORY)
    ----------------------------
    - The output MUST contain ONLY the final legal pleading.
    - DO NOT include:
      * explanations
      * reasoning steps
      * planning notes
      * task analysis
      * summaries of what you are doing
      * meta-commentary (e.g., "the user wants...", "I need to...")
    - DO NOT describe the drafting process.
    - DO NOT explain how the template was applied.
    - DO NOT restate the task instructions.
    - The response MUST begin directly with the pleading caption or first heading
      defined in `firm_template`.


  expected_output: |
    ONLY the final, fully drafted U.Sian legal pleading, with no explanations
    or reasoning text, that:
    - Follows the firm-specific template provided via `firm_template`
    - Uses ONLY authorities in `selected_authorities`
    - Uses placeholders for certification and signature details unless explicitly provided
    - Is compatible with docx generation using headings and lists


  
legal_research_us:
  description: |
    You are a U.S Legal Research Specialist.

    Inputs:
    - motion_type: `{motion_type}`
    - facts: `{facts}`
    - process: `{process}`
    - parts: `{parts}`
    - court: `{court}`

    Your job is to collect the MOST COMPREHENSIVE set of relevant U.S. legal authorities for the motion type
    and the factual context. You MUST use `web_search_tool` and `rag_search_tool` ITERATIVELY, running MULTIPLE
    searches and refining queries until you have strong coverage.

    ----------------------------
    JURISDICTION SCOPE (U.S ONLY)
    ----------------------------
    - Focus on U.S law only.
    - Determine whether `{court}` is federal or state based on its name; if unclear, treat it as federal
      and explain uncertainty in `research_strategy`.
    - Always include:
      (1) Governing procedural rules (Federal Rules or state equivalents if clearly identified),
      (2) Court's local rules if applicable,
      (3) Binding precedent from controlling appellate court,
      (4) Persuasive authority (district/state trial decisions) ONLY if useful.

    Reliability requirements:
    - Prefer PRIMARY SOURCES (official court websites, government/legal repositories, official PDFs).
    - Secondary sources (e.g., blogs) are NOT allowed unless they point to primary sources; if used,
      list them ONLY under `secondary_sources` and still provide the primary source as the real authority.

    Search requirements (must do):
    - Use multiple query angles:
      * motion type + rule number (e.g., "motion to dismiss FRCP 12(b)(6)")
      * motion type + elements/standard + "burden" + "plausibility" / "irreparable harm" etc.
      * controlling circuit/state + motion type + recent cases
      * `{court}` + "local rules" + motion type
      * fact keywords from `{facts}` + motion type + controlling jurisdiction
    - Prioritize RECENT case law, but do NOT exclude foundational controlling cases.

    ----------------------------
    OUTPUT FORMAT (MANDATORY)
    ----------------------------
    Output MUST be valid JSON ONLY (no markdown fences, no extra text).

    {
      "jurisdiction": "US",
      "court_analyzed": "{court}",
      "research_strategy": [
        "Short notes describing iterative searches performed, keywords, and rationale"
      ],

      "procedural_rules": [
        {
          "title": "Rule (e.g., Fed. R. Civ. P. 12(b)(6))",
          "scope": "federal" | "state" | "local",
          "summary": "Why it applies to this motion_type and this case context",
          "key_requirements": ["bullet requirement 1", "bullet requirement 2"],
          "citation": "Bluebook-style or standard rule citation",
          "source_name": "Source repository or official publisher",
          "url": "https://...",
          "authority_weight": "binding",
          "retrieved_at": "YYYY-MM-DD"
        }
      ],

      "statutes": [
        {
          "title": "Statute name/section (e.g., 28 U.S.C. § 1332)",
          "scope": "federal" | "state",
          "summary": "Why it matters to the motion/facts",
          "key_provisions": ["§ ...", "§ ..."],
          "citation": "Standard citation",
          "source_name": "Official repository",
          "url": "https://...",
          "authority_weight": "binding" | "persuasive",
          "retrieved_at": "YYYY-MM-DD"
        }
      ],

      "binding_case_law": [
        {
          "case_name": "Case Name v. Case Name",
          "court": "Controlling court (e.g., U.S. Supreme Court / 9th Cir.)",
          "year": "YYYY",
          "summary": "Holding + how it supports/limits the motion",
          "key_holdings": ["holding 1", "holding 2"],
          "citation": "Full citation",
          "source_name": "Court / official repository",
          "url": "https://...",
          "authority_weight": "binding",
          "retrieved_at": "YYYY-MM-DD"
        }
      ],

      "persuasive_case_law": [
        {
          "case_name": "Case Name v. Case Name",
          "court": "Court name",
          "year": "YYYY",
          "summary": "Reasoning + relevance",
          "key_holdings": ["point 1", "point 2"],
          "citation": "Full citation",
          "source_name": "Repository / publisher",
          "url": "https://...",
          "authority_weight": "persuasive",
          "retrieved_at": "YYYY-MM-DD"
        }
      ],

      "practice_guidance": [
        {
          "title": "Practical standard / elements / test (e.g., 'Winter factors for PI')",
          "summary": "Explain the test and how it maps to `{facts}`",
          "checklist": ["element 1", "element 2", "element 3"],
          "primary_support": [
            {
              "citation": "Case/Rule citation supporting the test",
              "url": "https://..."
            }
          ]
        }
      ],

      "secondary_sources": [
        {
          "title": "Secondary source title (ONLY if it points to primary authority)",
          "publisher": "Publisher / institution",
          "summary": "Why it was used and which primary authority it points to",
          "url": "https://...",
          "authority_weight": "secondary",
          "retrieved_at": "YYYY-MM-DD"
        }
      ]
    }

    Output requirements:
    - Populate ALL applicable sections; if none found, return [].
    - De-duplicate: do not repeat the same authority in multiple sections.
    - Prefer the most authoritative URL available (official over mirrors).
    - Ensure every item is tied to motion_type, facts, process, parts, or court.

  expected_output: |
    Valid JSON with topic-based lists of U.S. rules, statutes, binding case law,
    persuasive case law, and practical tests supported by primary authority.
